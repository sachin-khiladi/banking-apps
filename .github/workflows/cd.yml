name: CD

on:
  workflow_run:
    workflows: ["Terraform Infra Apply Dev", "Terraform Infra Apply Prod"]
    types:
      - completed

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    name: Resolve image tag
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    outputs:
      image_tag: ${{ steps.set-tag.outputs.image_tag }}
    steps:
      - name: Compute image tag
        id: set-tag
        run: |
          SHORT_SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${SHORT_SHA:0:12}"
          echo "image_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

  deploy_dev:
    name: Deploy dev
    needs: prepare
    if: ${{ github.event.workflow_run.name == 'Terraform Infra Apply Dev' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    uses: ./.github/workflows/workflow-deploy-aca-v1.0.0.yml
    with:
      resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP_DEV }}
      container_app_name: ${{ vars.CONTAINER_APP_NAME_DEV }}
      container_image_ref: "${{ vars.ACR_LOGIN_SERVER_DEV }}/banking-system/fastapi-azure-app:${{ needs.prepare.outputs.image_tag }}"
      release_environment: dev
      deployment_environment: banking-dev
      verify_image: false
      azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  deploy_prod:
    name: Deploy prod
    needs: prepare
    if: ${{ github.event.workflow_run.name == 'Terraform Infra Apply Prod' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    uses: ./.github/workflows/workflow-deploy-aca-v1.0.0.yml
    with:
      resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP_PROD }}
      container_app_name: ${{ vars.CONTAINER_APP_NAME_PROD }}
      container_image_ref: "${{ vars.ACR_LOGIN_SERVER_PROD }}/banking-system/fastapi-azure-app:${{ needs.prepare.outputs.image_tag }}"
      release_environment: prd
      deployment_environment: banking-prod
      verify_image: false
      azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
