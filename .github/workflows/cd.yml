name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      deploy_to:
        description: 'Target environment'
        type: choice
        options:
          - dev
          - staging
          - prod
          - all
        default: dev
      image_tag:
        description: 'Image tag to deploy (leave blank to use CI build tag)'
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    name: Resolve image tag
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
      }}
    outputs:
      image_tag: ${{ steps.set-tag.outputs.image_tag }}
    steps:
      - name: Compute image tag
        id: set-tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            RUN_ID="${{ github.event.workflow_run.run_id }}"
            SHORT_SHA="${{ github.event.workflow_run.head_sha }}"
            SHORT_SHA="${SHORT_SHA:0:12}"
            echo "image_tag=banking-apps-${RUN_ID}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.image_tag }}" ]]; then
            echo "image_tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA="${GITHUB_SHA:0:12}"
            echo "image_tag=banking-apps-${{ github.run_id }}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

  deploy_dev:
    name: Deploy dev
    needs: prepare
    if: >-
      ${{
        github.event_name == 'workflow_run' || inputs.deploy_to == 'dev' || inputs.deploy_to == 'all'
      }}
    uses: ./.github/workflows/workflow-deploy-aca-v1.0.0.yml
    with:
      resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP_DEV }}
      container_app_name: ${{ vars.CONTAINER_APP_NAME_DEV }}
      container_image_ref: "${{ vars.ACR_LOGIN_SERVER_DEV }}/banking-system/fastapi-azure-app:${{ needs.prepare.outputs.image_tag }}"
      release_environment: dev
      deployment_environment: banking-dev
      verify_image: false
    secrets:
      azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  deploy_staging:
    name: Deploy staging
    needs:
      - prepare
      - deploy_dev
    if: >-
      ${{
        (github.event_name == 'workflow_run' || inputs.deploy_to == 'staging' || inputs.deploy_to == 'all') &&
        (needs.deploy_dev.result == 'success' || needs.deploy_dev.result == 'skipped')
      }}
    uses: ./.github/workflows/workflow-deploy-aca-v1.0.0.yml
    with:
      resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP_STAGING }}
      container_app_name: ${{ vars.CONTAINER_APP_NAME_STAGING }}
      container_image_ref: "${{ vars.ACR_LOGIN_SERVER_STAGING }}/banking-system/fastapi-azure-app:${{ needs.prepare.outputs.image_tag }}"
      release_environment: staging
      deployment_environment: banking-staging
      verify_image: false
    secrets:
      azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  deploy_prod:
    name: Deploy prod
    needs:
      - prepare
      - deploy_staging
    if: >-
      ${{
        (github.event_name == 'workflow_run' || inputs.deploy_to == 'prod' || inputs.deploy_to == 'all') &&
        (needs.deploy_staging.result == 'success' || needs.deploy_staging.result == 'skipped')
      }}
    uses: ./.github/workflows/workflow-deploy-aca-v1.0.0.yml
    with:
      resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP_PROD }}
      container_app_name: ${{ vars.CONTAINER_APP_NAME_PROD }}
      container_image_ref: "${{ vars.ACR_LOGIN_SERVER_PROD }}/banking-system/fastapi-azure-app:${{ needs.prepare.outputs.image_tag }}"
      release_environment: prd
      deployment_environment: banking-prod
      verify_image: false
    secrets:
      azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
