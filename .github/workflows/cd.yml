name: CD

# Deployment orchestration is infra-first for dev.
# Dev deploys only after successful dev infra apply.

on:
  workflow_run:
    workflows: ["Terraform Infra Apply Dev"]
    types:
      - completed

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    name: Resolve image tag
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.name == 'Terraform Infra Apply Dev' &&
        github.event.workflow_run.event == 'workflow_run'
      }}
    outputs:
      image_tag: ${{ steps.set-tag.outputs.image_tag }}
    steps:
      - name: Ensure CI succeeded for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          api_url="https://api.github.com/repos/${REPO}/actions/runs?head_sha=${HEAD_SHA}&event=push&status=completed&per_page=100"
          ci_success_count="$(
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${api_url}" |
            jq '[.workflow_runs[] | select(.name == "CI" and .conclusion == "success")] | length'
          )"

          if [[ "${ci_success_count}" -lt 1 ]]; then
            echo "::error::No successful CI run found for commit '${HEAD_SHA}'."
            echo "::error::Deployment is blocked because the image may not have been built/pushed."
            exit 1
          fi

          echo "Found successful CI run for commit '${HEAD_SHA}'."

      - name: Compute image tag
        id: set-tag
        run: |
          SHORT_SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${SHORT_SHA:0:12}"
          echo "image_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

  deploy_dev:
    name: Deploy dev
    needs: prepare
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.name == 'Terraform Infra Apply Dev' &&
        github.event.workflow_run.event == 'workflow_run'
      }}
    concurrency:
      group: deploy-banking-dev
      cancel-in-progress: false
    uses: ./.github/workflows/workflow-deploy-aca-v1.0.0.yml
    with:
      resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP_DEV }}
      container_app_name: ${{ vars.CONTAINER_APP_NAME_DEV }}
      container_image_ref: "${{ vars.ACR_LOGIN_SERVER_DEV }}/banking-system/fastapi-azure-app:${{ needs.prepare.outputs.image_tag }}"
      release_environment: dev
      deployment_environment: banking-dev
      verify_image: false
      additional_deploy_args: "--revision-suffix ${{ needs.prepare.outputs.image_tag }}"
      azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
