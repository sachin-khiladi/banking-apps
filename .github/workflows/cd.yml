name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      deploy_to:
        description: 'Target environment'
        type: choice
        options:
          - dev
          - staging
          - prod
          - all
        default: dev
      image_tag:
        description: 'Image tag to deploy (optional)'
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

env:
  RESOLVED_IMAGE_TAG: >-
    ${{ github.event_name == 'workflow_run' && github.event.workflow_run.run_id || (inputs.image_tag != '' && inputs.image_tag || github.run_id) }}

jobs:
  deploy_dev:
    if: >-
      ${{
        (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
        (github.event_name == 'workflow_run' || inputs.deploy_to == 'dev' || inputs.deploy_to == 'all')
      }}
    name: Deploy dev
    runs-on: ubuntu-latest
    environment: banking-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_DEV }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Container App (dev)
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP_DEV }}
          containerAppName: ${{ vars.CONTAINER_APP_NAME_DEV }}
          imageToDeploy: ${{ vars.ACR_LOGIN_SERVER_DEV }}/banking-system/fastapi-azure-app:${{ env.RESOLVED_IMAGE_TAG }}

      - name: Health check (dev)
        uses: ./.github/actions/health-check
        with:
          container_app_name: ${{ vars.CONTAINER_APP_NAME_DEV }}
          resource_group: ${{ vars.AZURE_RESOURCE_GROUP_DEV }}

  deploy_staging:
    if: >-
      ${{
        (inputs.deploy_to == 'staging' || inputs.deploy_to == 'all') &&
        (needs.deploy_dev.result == 'success' || needs.deploy_dev.result == 'skipped')
      }}
    needs:
      - deploy_dev
    name: Deploy staging
    runs-on: ubuntu-latest
    environment: banking-staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_STAGING }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Container App (staging)
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP_STAGING }}
          containerAppName: ${{ vars.CONTAINER_APP_NAME_STAGING }}
          imageToDeploy: ${{ vars.ACR_LOGIN_SERVER_STAGING }}/banking-system/fastapi-azure-app:${{ env.RESOLVED_IMAGE_TAG }}

      - name: Health check (staging)
        uses: ./.github/actions/health-check
        with:
          container_app_name: ${{ vars.CONTAINER_APP_NAME_STAGING }}
          resource_group: ${{ vars.AZURE_RESOURCE_GROUP_STAGING }}

  deploy_prod:
    if: >-
      ${{
        (inputs.deploy_to == 'prod' || inputs.deploy_to == 'all') &&
        (needs.deploy_staging.result == 'success' || needs.deploy_staging.result == 'skipped')
      }}
    needs:
      - deploy_staging
    name: Deploy prod
    runs-on: ubuntu-latest
    environment: banking-prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_PROD }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Container App (prod)
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP_PROD }}
          containerAppName: ${{ vars.CONTAINER_APP_NAME_PROD }}
          imageToDeploy: ${{ vars.ACR_LOGIN_SERVER_PROD }}/banking-system/fastapi-azure-app:${{ env.RESOLVED_IMAGE_TAG }}

      - name: Health check (prod)
        uses: ./.github/actions/health-check
        with:
          container_app_name: ${{ vars.CONTAINER_APP_NAME_PROD }}
          resource_group: ${{ vars.AZURE_RESOURCE_GROUP_PROD }}
