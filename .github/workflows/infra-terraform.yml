name: Terraform Infra Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - infra/**
      - .github/workflows/infra-terraform.yml

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.9.8"
  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true

jobs:
  plan_dev:
    name: Lint, Validate, and Plan Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login (dev)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure required Azure resource providers are registered (dev)
        run: |
          set -euo pipefail
          providers=(
            "Microsoft.App"
            "Microsoft.AppConfiguration"
            "Microsoft.Authorization"
            "Microsoft.ContainerRegistry"
            "Microsoft.DocumentDB"
            "Microsoft.Insights"
            "Microsoft.KeyVault"
            "Microsoft.OperationalInsights"
            "Microsoft.Storage"
          )

          for namespace in "${providers[@]}"; do
            state="$(az provider show --namespace "$namespace" --query registrationState -o tsv 2>/dev/null || echo "NotRegistered")"
            if [[ "$state" != "Registered" ]]; then
              echo "Registering provider: $namespace (current: $state)"
              az provider register --namespace "$namespace" --wait
            else
              echo "Provider already registered: $namespace"
            fi
          done

      - name: Validate required tfvars inputs (dev)
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          env_dir = pathlib.Path("infra/environments/dev")
          variables_tf = env_dir / "variables.tf"
          tfvars = env_dir / "terraform.tfvars"

          required = []
          for name, body in re.findall(r'variable\s+"([^"]+)"\s*\{(.*?)\n\}', variables_tf.read_text(), re.S):
              if re.search(r'\bdefault\s*=', body) is None:
                  required.append(name)

          provided = set(re.findall(r'^\s*([A-Za-z0-9_]+)\s*=\s*', tfvars.read_text(), re.M))
          missing = [name for name in required if name not in provided]
          if missing:
              print(f"Missing required tfvars inputs for dev: {', '.join(missing)}")
              sys.exit(1)

          print(f"dev tfvars validation passed ({len(required)} required inputs found).")
          PY

      - name: Terraform fmt check
        run: terraform fmt -check -recursive infra/

      - name: Terraform init (dev)
        working-directory: infra/environments/dev
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: terraform init -input=false

      - name: Terraform validate (dev)
        working-directory: infra/environments/dev
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: terraform validate -no-color

      - name: Terraform plan (dev)
        working-directory: infra/environments/dev
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: terraform plan -input=false -no-color -var-file=terraform.tfvars

      - name: Run Trivy IaC vulnerability scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: config
          scan-ref: infra/
          severity: HIGH,CRITICAL
          exit-code: '1'

