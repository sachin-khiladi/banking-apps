name: Terraform Infra Apply Prod

# Prod infra is a promotion step.
# It only runs by manual dispatch and relies on the banking-prod environment
# for human approval before infrastructure changes are applied.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Change ticket or deployment reason
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
  actions: write

env:
  TF_VERSION: "1.9.8"
  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true

jobs:
  apply_prod:
    name: Apply prod
    runs-on: ubuntu-latest
    environment: banking-prod
    if: ${{ github.ref == 'refs/heads/main' }}
    concurrency:
      group: infra-prod-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login (prod)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure required Azure resource providers are registered (prod)
        run: |
          set -euo pipefail
          providers=(
            "Microsoft.App"
            "Microsoft.AppConfiguration"
            "Microsoft.Authorization"
            "Microsoft.ContainerRegistry"
            "Microsoft.DocumentDB"
            "Microsoft.Insights"
            "Microsoft.KeyVault"
            "Microsoft.OperationalInsights"
            "Microsoft.Storage"
          )

          for namespace in "${providers[@]}"; do
            state="$(az provider show --namespace "$namespace" --query registrationState -o tsv 2>/dev/null || echo "NotRegistered")"
            if [[ "$state" != "Registered" ]]; then
              echo "Registering provider: $namespace (current: $state)"
              az provider register --namespace "$namespace" --wait
            else
              echo "Provider already registered: $namespace"
            fi
          done

      - name: Validate required tfvars inputs (prod)
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          env_dir = pathlib.Path("infra/environments/prod")
          variables_tf = env_dir / "variables.tf"
          tfvars = env_dir / "terraform.tfvars"

          required = []
          for name, body in re.findall(r'variable\s+"([^"]+)"\s*\{(.*?)\n\}', variables_tf.read_text(), re.S):
              if re.search(r'\bdefault\s*=', body) is None:
                  required.append(name)

          provided = set(re.findall(r'^\s*([A-Za-z0-9_]+)\s*=\s*', tfvars.read_text(), re.M))
          missing = [name for name in required if name not in provided]
          if missing:
              print(f"Missing required tfvars inputs for prod: {', '.join(missing)}")
              sys.exit(1)

          print(f"prod tfvars validation passed ({len(required)} required inputs found).")
          PY

      - name: Remove failed Container App if present (pre-flight cleanup)
        # The azurerm provider returns 400 when refreshing a Container App that is
        # in ProvisioningState 'Failed', blocking both plan and apply.  Delete it
        # here so Terraform can re-create it cleanly.  This step is a no-op when
        # the app does not exist or is already in a healthy provisioning state.
        run: |
          STATE=$(az containerapp show \
            --name "ca-bankapi-prod" \
            --resource-group "rg-bankapi-prod" \
            --query "properties.provisioningState" \
            --output tsv 2>/dev/null || echo "NotFound")
          echo "Container App 'ca-bankapi-prod' provisioning state: ${STATE}"
          if [ "$STATE" = "Failed" ]; then
            echo "Deleting failed Container App to allow Terraform clean re-creation..."
            az containerapp delete \
              --name "ca-bankapi-prod" \
              --resource-group "rg-bankapi-prod" \
              --yes
            echo "Deletion complete."
          else
            echo "No pre-flight cleanup required."
          fi

      - name: Terraform init (prod)
        working-directory: infra/environments/prod
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: terraform init -input=false

      - name: Terraform plan pre-apply (prod)
        working-directory: infra/environments/prod
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: terraform plan -out=tfplan -input=false -no-color -var-file=terraform.tfvars

      - name: Terraform apply (prod)
        working-directory: infra/environments/prod
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Export Terraform outputs to GitHub repository variables (prod)
        continue-on-error: true
        working-directory: infra/environments/prod
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RG=$(terraform output -raw resource_group_name)
          CA=$(terraform output -raw container_app_name)
          ACR=$(terraform output -raw acr_login_server)
          gh variable set AZURE_RESOURCE_GROUP_PROD --body "$RG" --repo "$GITHUB_REPOSITORY" || echo "::warning::Unable to set AZURE_RESOURCE_GROUP_PROD repository variable."
          gh variable set CONTAINER_APP_NAME_PROD --body "$CA" --repo "$GITHUB_REPOSITORY" || echo "::warning::Unable to set CONTAINER_APP_NAME_PROD repository variable."
          gh variable set ACR_LOGIN_SERVER_PROD --body "$ACR" --repo "$GITHUB_REPOSITORY" || echo "::warning::Unable to set ACR_LOGIN_SERVER_PROD repository variable."
          echo "Exported prod deployment variables: RG=${RG}, CA=${CA}, ACR=${ACR}"
