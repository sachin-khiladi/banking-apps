name: Terraform Infra Apply Dev

# Dev infra is the first deployment step after a successful CI image build.
# App deployment is chained from this workflow via cd.yml on success.

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read
  id-token: write
  actions: write

env:
  TF_VERSION: "1.9.8"
  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true
  EXPECTED_DEPLOYMENT_PRINCIPAL_OBJECT_ID: "cd7ca1e6-67f4-4120-b3a2-615de398cc6a"

jobs:
  apply_dev:
    name: Apply dev
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        (
          github.event.workflow_run.event == 'push' ||
          github.event.workflow_run.event == 'workflow_dispatch'
        )
      }}
    environment: banking-dev
    concurrency:
      group: infra-dev-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login (dev)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate OIDC principal and RBAC prerequisites (dev)
        run: |
          set -euo pipefail

          if [[ -z "${{ vars.AZURE_CLIENT_ID }}" ]]; then
            echo "ERROR: vars.AZURE_CLIENT_ID is empty; cannot validate OIDC principal." >&2
            exit 1
          fi

          subscription_scope="/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}"
          expected_oid="${EXPECTED_DEPLOYMENT_PRINCIPAL_OBJECT_ID}"

          current_oid="$(az ad sp show --id "${{ vars.AZURE_CLIENT_ID }}" --query id -o tsv)"
          echo "Expected deployment principal object id: ${expected_oid}"
          echo "OIDC login service principal object id: ${current_oid}"

          if [[ "${current_oid}" != "${expected_oid}" ]]; then
            echo "ERROR: OIDC principal mismatch. AZURE_CLIENT_ID resolves to ${current_oid}, expected ${expected_oid}." >&2
            exit 1
          fi

          has_contributor="$(az role assignment list --assignee-object-id "${current_oid}" --scope "${subscription_scope}" --query "[?roleDefinitionName=='Contributor'] | length(@)" -o tsv)"
          has_uaa="$(az role assignment list --assignee-object-id "${current_oid}" --scope "${subscription_scope}" --query "[?roleDefinitionName=='User Access Administrator'] | length(@)" -o tsv)"

          if [[ "${has_contributor:-0}" == "0" ]]; then
            echo "ERROR: Missing subscription-scope Contributor on deployment principal ${current_oid}." >&2
            echo "Run scripts/bootstrap_pipeline_rbac.sh as a privileged operator before running infra apply." >&2
            exit 1
          fi

          if [[ "${has_uaa:-0}" == "0" ]]; then
            echo "ERROR: Missing subscription-scope User Access Administrator on deployment principal ${current_oid}." >&2
            echo "Run scripts/bootstrap_pipeline_rbac.sh as a privileged operator before running infra apply." >&2
            exit 1
          fi

          echo "OIDC principal and subscription RBAC prerequisites validated."

      - name: Ensure required Azure resource providers are registered (dev)
        run: |
          set -euo pipefail
          providers=(
            "Microsoft.App"
            "Microsoft.AppConfiguration"
            "Microsoft.Authorization"
            "Microsoft.ContainerRegistry"
            "Microsoft.DocumentDB"
            "Microsoft.Insights"
            "Microsoft.KeyVault"
            "Microsoft.OperationalInsights"
            "Microsoft.Storage"
          )

          for namespace in "${providers[@]}"; do
            state="$(az provider show --namespace "$namespace" --query registrationState -o tsv 2>/dev/null || echo "NotRegistered")"
            if [[ "$state" != "Registered" ]]; then
              echo "Registering provider: $namespace (current: $state)"
              az provider register --namespace "$namespace" --wait
            else
              echo "Provider already registered: $namespace"
            fi
          done

      - name: Validate required tfvars inputs (dev)
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          env_dir = pathlib.Path("infra/environments/dev")
          variables_tf = env_dir / "variables.tf"
          tfvars = env_dir / "terraform.tfvars"

          required = []
          for name, body in re.findall(r'variable\s+"([^"]+)"\s*\{(.*?)\n\}', variables_tf.read_text(), re.S):
              if re.search(r'\bdefault\s*=', body) is None:
                  required.append(name)

          provided = set(re.findall(r'^\s*([A-Za-z0-9_]+)\s*=\s*', tfvars.read_text(), re.M))
          missing = [name for name in required if name not in provided]
          if missing:
              print(f"Missing required tfvars inputs for dev: {', '.join(missing)}")
              sys.exit(1)

          print(f"dev tfvars validation passed ({len(required)} required inputs found).")
          PY

      - name: Terraform init (dev)
        working-directory: infra/environments/dev
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: terraform init -input=false

      - name: Terraform plan pre-apply (dev)
        working-directory: infra/environments/dev
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: terraform plan -out=tfplan -input=false -no-color -var-file=terraform.tfvars

      - name: Terraform apply (dev)
        working-directory: infra/environments/dev
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Export Terraform outputs to GitHub repository variables (dev)
        working-directory: infra/environments/dev
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RG=$(terraform output -raw resource_group_name)
          CA=$(terraform output -raw container_app_name)
          ACR=$(terraform output -raw acr_login_server)
          gh variable set AZURE_RESOURCE_GROUP_DEV --body "$RG" --repo "$GITHUB_REPOSITORY"
          gh variable set CONTAINER_APP_NAME_DEV --body "$CA" --repo "$GITHUB_REPOSITORY"
          gh variable set ACR_LOGIN_SERVER_DEV --body "$ACR" --repo "$GITHUB_REPOSITORY"
          echo "Exported dev deployment variables: RG=${RG}, CA=${CA}, ACR=${ACR}"
