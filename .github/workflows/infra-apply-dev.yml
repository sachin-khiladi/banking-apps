name: Terraform Infra Apply Dev

# Dev infra is the automatic first deployment step after mainline changes.
# App deployment is chained from this workflow via cd.yml on successful completion.

on:
  push:
    branches:
      - main
    paths:
      - infra/**
      - .github/workflows/infra-apply-dev.yml
      - .github/workflows/cd.yml
  workflow_dispatch:
    inputs:
      reason:
        description: Change ticket or deployment reason
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.9.8"
  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true

jobs:
  apply_dev:
    name: Apply dev
    runs-on: ubuntu-latest
    environment: banking-dev
    concurrency:
      group: infra-dev-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login (dev)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate required tfvars inputs (dev)
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          env_dir = pathlib.Path("infra/environments/dev")
          variables_tf = env_dir / "variables.tf"
          tfvars = env_dir / "terraform.tfvars"

          required = []
          for name, body in re.findall(r'variable\s+"([^"]+)"\s*\{(.*?)\n\}', variables_tf.read_text(), re.S):
              if re.search(r'\bdefault\s*=', body) is None:
                  required.append(name)

          provided = set(re.findall(r'^\s*([A-Za-z0-9_]+)\s*=\s*', tfvars.read_text(), re.M))
          missing = [name for name in required if name not in provided]
          if missing:
              print(f"Missing required tfvars inputs for dev: {', '.join(missing)}")
              sys.exit(1)

          print(f"dev tfvars validation passed ({len(required)} required inputs found).")
          PY

      - name: Remove failed Container App if present (pre-flight cleanup)
        # The azurerm provider returns 400 when refreshing a Container App that is
        # in ProvisioningState 'Failed', blocking both plan and apply.  Delete it
        # here so Terraform can re-create it cleanly.  This step is a no-op when
        # the app does not exist or is already in a healthy provisioning state.
        run: |
          STATE=$(az containerapp show \
            --name "ca-bankapi-dev" \
            --resource-group "rg-bankapi-dev" \
            --query "properties.provisioningState" \
            --output tsv 2>/dev/null || echo "NotFound")
          echo "Container App 'ca-bankapi-dev' provisioning state: ${STATE}"
          if [ "$STATE" = "Failed" ]; then
            echo "Deleting failed Container App to allow Terraform clean re-creation..."
            az containerapp delete \
              --name "ca-bankapi-dev" \
              --resource-group "rg-bankapi-dev" \
              --yes
            echo "Deletion complete."
          else
            echo "No pre-flight cleanup required."
          fi

      - name: Terraform init (dev)
        working-directory: infra/environments/dev
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: terraform init -input=false

      - name: Terraform plan pre-apply (dev)
        working-directory: infra/environments/dev
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: terraform plan -out=tfplan -input=false -no-color -var-file=terraform.tfvars

      - name: Terraform apply (dev)
        working-directory: infra/environments/dev
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: terraform apply -input=false -auto-approve tfplan
