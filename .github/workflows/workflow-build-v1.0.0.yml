# reusable GitHub Actions workflow template: python build
name: python-build-template-v1.0.0

on:
  workflow_call:
    inputs:
      python_version:
        required: false
        type: string
        default: '3.11'
      working_directory:
        required: false
        type: string
        default: '.'
      release_environment:
        required: false
        type: string
        default: 'dev'
      docker_image_ref:
        required: false
        type: string
        default: ''
      additional_release_tags:
        required: false
        type: string
        default: ''
      container_registry_url:
        required: false
        type: string
        default: ''
      container_image_repository:
        required: false
        type: string
        default: ''
      azure_client_id:
        required: false
        type: string
        default: ''
      azure_tenant_id:
        required: false
        type: string
        default: ''
      azure_subscription_id:
        required: false
        type: string
        default: ''
      sign_image:
        required: false
        type: boolean
        default: true
      generate_sbom:
        required: false
        type: boolean
        default: true
    secrets:
      registry_username:
        required: false
      registry_password:
        required: false
      cosign_key:
        required: false
      cosign_password:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  python-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run pylint
        run: pylint src/

      - name: Run unit tests with coverage
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85 \
            --junitxml=pytest-results.xml

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results
          path: |
            pytest-results.xml
            coverage.xml

      - name: Validate Python Source
        run: python -m compileall .

      - name: Docker Trivy Scan
        if: ${{ inputs.docker_image_ref != '' }}
        working-directory: .
        run: |
          chmod +x scripts/docker-trivy-scan-v1.0.0.sh
          scripts/docker-trivy-scan-v1.0.0.sh "${{ inputs.docker_image_ref }}"

      - name: Create Release Stamp Metadata
        working-directory: .
        run: |
          chmod +x scripts/release-stamp-v1.0.0.sh
          scripts/release-stamp-v1.0.0.sh release-stamp.json "${{ inputs.release_environment }}" "${GITHUB_REF_NAME}" "${GITHUB_SHA}" "${GITHUB_WORKFLOW}" "${{ inputs.additional_release_tags }}"

      - name: Upload Release Stamp Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-stamp
          path: release-stamp.json

      - name: Azure Login for ACR push
        if: ${{ inputs.container_image_repository != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ inputs.azure_client_id }}
          tenant-id: ${{ inputs.azure_tenant_id }}
          subscription-id: ${{ inputs.azure_subscription_id }}

      - name: Validate image publish inputs
        if: ${{ inputs.container_image_repository != '' }}
        run: |
          set -euo pipefail
          if [[ -z "${{ inputs.container_registry_url }}" ]]; then
            echo "::error::Image publish requested but 'container_registry_url' is empty. Provide the target ACR login server."
            exit 1
          fi
          if [[ -z "${{ inputs.azure_client_id }}" || -z "${{ inputs.azure_tenant_id }}" || -z "${{ inputs.azure_subscription_id }}" ]]; then
            echo "::error::Image publish requested but Azure OIDC inputs are missing. Provide azure_client_id, azure_tenant_id, and azure_subscription_id."
            exit 1
          fi
          if [[ ! "${{ inputs.container_image_repository }}" =~ ^project/[a-z0-9][a-z0-9._-]*$ ]]; then
            echo "::error::container_image_repository must be project/<project-name> to align with ACR ABAC policy."
            exit 1
          fi

      - name: Create Traceable Image Tag
        if: ${{ inputs.container_registry_url != '' && inputs.container_image_repository != '' }}
        run: |
          REPO_SLUG="$(basename \"${GITHUB_REPOSITORY}\" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')"
          SHORT_SHA="${GITHUB_SHA:0:12}"
          IMAGE_TRACE_TAG="${REPO_SLUG}-${GITHUB_RUN_ID}-${SHORT_SHA}"
          IMAGE_SHA_TAG="sha-${SHORT_SHA}"
          echo "IMAGE_TRACE_TAG=${IMAGE_TRACE_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE_SHA_TAG=${IMAGE_SHA_TAG}" >> "$GITHUB_ENV"
          echo "Traceable image tag: ${IMAGE_TRACE_TAG}"
          echo "Deterministic image tag: ${IMAGE_SHA_TAG}"

      - name: Build Docker Image
        if: ${{ inputs.container_registry_url != '' && inputs.container_image_repository != '' }}
        run: |
          IMAGE_TRACE_NAME="${{ inputs.container_registry_url }}/${{ inputs.container_image_repository }}:${IMAGE_TRACE_TAG}"
          IMAGE_SHA_NAME="${{ inputs.container_registry_url }}/${{ inputs.container_image_repository }}:${IMAGE_SHA_TAG}"
          echo "Building docker image: $IMAGE_TRACE_NAME"
          docker build -t "$IMAGE_TRACE_NAME" -t "$IMAGE_SHA_NAME" -f Dockerfile ${{ inputs.working_directory }}

      - name: Push Docker Image
        if: ${{ inputs.container_registry_url != '' && inputs.container_image_repository != '' }}
        run: |
          set -euo pipefail
          ACR_NAME="${{ inputs.container_registry_url }}"
          ACR_NAME="${ACR_NAME%%.azurecr.io}"
          ACR_ACCESS_TOKEN="$(az acr login --name "${ACR_NAME}" --expose-token --query accessToken --output tsv)"
          echo "${ACR_ACCESS_TOKEN}" | docker login "${{ inputs.container_registry_url }}" --username "00000000-0000-0000-0000-000000000000" --password-stdin

          IMAGE_TRACE_NAME="${{ inputs.container_registry_url }}/${{ inputs.container_image_repository }}:${IMAGE_TRACE_TAG}"
          IMAGE_SHA_NAME="${{ inputs.container_registry_url }}/${{ inputs.container_image_repository }}:${IMAGE_SHA_TAG}"
          docker push "$IMAGE_TRACE_NAME"
          docker push "$IMAGE_SHA_NAME"

      - name: Generate image metadata
        if: ${{ inputs.container_registry_url != '' && inputs.container_image_repository != '' }}
        run: |
          set -euo pipefail
          IMAGE_TRACE_NAME="${{ inputs.container_registry_url }}/${{ inputs.container_image_repository }}:${IMAGE_TRACE_TAG}"
          IMAGE_SHA_NAME="${{ inputs.container_registry_url }}/${{ inputs.container_image_repository }}:${IMAGE_SHA_TAG}"
          IMAGE_DIGEST="$(docker buildx imagetools inspect "$IMAGE_SHA_NAME" | awk '/Digest:/ {print $2; exit}')"
          if [[ -z "${IMAGE_DIGEST}" ]]; then
            echo "::error::Unable to resolve image digest for '${IMAGE_SHA_NAME}'."
            exit 1
          fi

          cat > image-metadata.json <<EOF
          {
            "commit_sha": "${GITHUB_SHA}",
            "branch": "${GITHUB_REF_NAME}",
            "image_trace_tag": "${IMAGE_TRACE_TAG}",
            "image_sha_tag": "${IMAGE_SHA_TAG}",
            "image_trace_ref": "${IMAGE_TRACE_NAME}",
            "image_sha_ref": "${IMAGE_SHA_NAME}",
            "image_digest": "${IMAGE_DIGEST}",
            "image_digest_ref": "${{ inputs.container_registry_url }}/${{ inputs.container_image_repository }}@${IMAGE_DIGEST}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}"
          }
          EOF

      - name: Upload image metadata artifact
        if: ${{ inputs.container_registry_url != '' && inputs.container_image_repository != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: image-metadata
          path: image-metadata.json

      - name: Generate SBOM
        if: ${{ inputs.generate_sbom == true && inputs.container_registry_url != '' }}
        working-directory: .
        run: |
          chmod +x scripts/generate-sbom-v1.0.0.sh
          scripts/generate-sbom-v1.0.0.sh "${{ inputs.container_registry_url }}/${{ inputs.container_image_repository }}:${IMAGE_TRACE_TAG}" sbom.json

      - name: Upload SBOM Artifact
        if: ${{ inputs.generate_sbom == true }}
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
