# reusable GitHub Actions workflow template: deploy to Azure Container Apps
name: deploy-aca-template-v1.0.0

on:
  workflow_call:
    inputs:
      resource_group_name:
        required: true
        type: string
      container_app_name:
        required: true
        type: string
      container_image_ref:
        required: true
        type: string
      release_environment:
        required: false
        type: string
        default: 'dev'
      verify_image:
        required: false
        type: boolean
        default: true
      verify_signature:
        required: false
        type: boolean
        default: false
      deployment_environment:
        required: false
        type: string
        default: 'aca-deploy'
      additional_deploy_args:
        required: false
        type: string
        default: ''
      azure_client_id:
        required: true
        type: string
      azure_tenant_id:
        required: true
        type: string
      azure_subscription_id:
        required: true
        type: string
    secrets:
      azure_client_id:
        required: false
      registry_username:
        required: false
      registry_password:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy-aca:
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment_environment }}
    env:
      DEPLOY_RESOURCE_GROUP: ${{ inputs.resource_group_name != '' && inputs.resource_group_name || format('rg-bankapi-{0}', inputs.release_environment) }}
      DEPLOY_CONTAINER_APP: ${{ inputs.container_app_name != '' && inputs.container_app_name || format('ca-bankapi-{0}', inputs.release_environment) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download SBOM Artifact
        uses: actions/download-artifact@v4
        if: ${{ inputs.verify_image == true }}
        with:
          name: sbom

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ inputs.azure_client_id }}
          tenant-id: ${{ inputs.azure_tenant_id }}
          subscription-id: ${{ inputs.azure_subscription_id }}

      - name: Resolve container image reference
        run: |
          set -euo pipefail
          image_ref="${{ inputs.container_image_ref }}"
          if [[ "$image_ref" == /* ]]; then
            acr_login_server="$(az acr list --resource-group "${DEPLOY_RESOURCE_GROUP}" --query "[0].loginServer" --output tsv)"
            if [[ -z "${acr_login_server}" ]]; then
              echo "::error::Unable to resolve ACR login server from resource group '${DEPLOY_RESOURCE_GROUP}'."
              exit 1
            fi
            image_ref="${acr_login_server}${image_ref}"
          fi
          echo "DEPLOY_IMAGE_REF=${image_ref}" >> "$GITHUB_ENV"

      - name: Verify Image Exists in ACR
        run: |
          set -euo pipefail
          # Only check ACR images (skip bootstrap/non-ACR references)
          if [[ "${DEPLOY_IMAGE_REF}" != *".azurecr.io/"* ]]; then
            echo "Image '${DEPLOY_IMAGE_REF}' is not an ACR image — skipping ACR existence check."
          else
            # Extract the ACR registry name (everything before '.azurecr.io/')
            ACR_NAME="${DEPLOY_IMAGE_REF%%.azurecr.io/*}"
            # Strip registry FQDN prefix to get repo:tag
            IMAGE_WITH_TAG="${DEPLOY_IMAGE_REF#*azurecr.io/}"
            if [[ -z "${ACR_NAME}" || "${IMAGE_WITH_TAG}" == "${DEPLOY_IMAGE_REF}" ]]; then
              echo "::error::Could not parse ACR registry name or image from '${DEPLOY_IMAGE_REF}'. Expected format: <registry>.azurecr.io/<repo>:<tag>"
              exit 1
            fi
            IMAGE_REPO="${IMAGE_WITH_TAG%%:*}"
            IMAGE_TAG="${IMAGE_WITH_TAG##*:}"
            echo "Checking image exists: ${DEPLOY_IMAGE_REF}"
            # Use show-tags for a reliable tag-level existence check (avoids --output none
            # exit-code ambiguity present in some Azure CLI versions)
            TAG_FOUND=$(az acr repository show-tags \
              --name "${ACR_NAME}" \
              --repository "${IMAGE_REPO}" \
              --query "contains(@, '${IMAGE_TAG}')" \
              --output tsv 2>/dev/null || echo "false")
            if [[ "${TAG_FOUND}" != "true" ]]; then
              echo "::error::Image '${DEPLOY_IMAGE_REF}' was not found in ACR '${ACR_NAME}'."
              echo "::error::Ensure the CI build workflow completed successfully and pushed the image for commit SHA '${IMAGE_TAG}' before triggering deployment."
              exit 1
            fi
            echo "Image verified in ACR: ${DEPLOY_IMAGE_REF}"
          fi

      - name: Verify Image Integrity & Attestation
        if: ${{ inputs.verify_image == true }}
        run: |
          chmod +x ./scripts/verify-image-v1.0.0.sh
          ./scripts/verify-image-v1.0.0.sh \
            "${DEPLOY_IMAGE_REF}" \
            --verify-signature \
            --verify-sbom \
            --fail-on-missing
        env:
          IMAGE_VERIFY_MODE: standard
          SBOM_JSON_PATH: sbom/sbom.json

      - name: Deploy to Azure Container Apps
        run: |
          set -euo pipefail
          echo "Deploying container image to Azure Container Apps..."
          az containerapp update \
            --resource-group "${DEPLOY_RESOURCE_GROUP}" \
            --name "${DEPLOY_CONTAINER_APP}" \
            --image "${DEPLOY_IMAGE_REF}" \
            ${{ inputs.additional_deploy_args }}

      - name: Validate active revision and health
        run: |
          set -euo pipefail

          ACTIVE_REVISION="$(az containerapp show \
            --resource-group "${DEPLOY_RESOURCE_GROUP}" \
            --name "${DEPLOY_CONTAINER_APP}" \
            --query "properties.latestReadyRevisionName" \
            --output tsv)"

          if [[ -z "${ACTIVE_REVISION}" || "${ACTIVE_REVISION}" == "null" ]]; then
            echo "::error::No latest ready revision found after deployment."
            exit 1
          fi

          IS_ACTIVE="$(az containerapp revision list \
            --resource-group "${DEPLOY_RESOURCE_GROUP}" \
            --name "${DEPLOY_CONTAINER_APP}" \
            --query "[?name=='${ACTIVE_REVISION}' && properties.active==\`true\`] | length(@)" \
            --output tsv)"

          if [[ "${IS_ACTIVE}" != "1" ]]; then
            echo "::error::Revision '${ACTIVE_REVISION}' is not active."
            exit 1
          fi

          FQDN="$(az containerapp show \
            --resource-group "${DEPLOY_RESOURCE_GROUP}" \
            --name "${DEPLOY_CONTAINER_APP}" \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)"

          if [[ -z "${FQDN}" || "${FQDN}" == "null" ]]; then
            echo "::error::Container App ingress FQDN not found."
            exit 1
          fi

          HEALTH_URL="https://${FQDN}/health"
          echo "Validating health endpoint: ${HEALTH_URL}"
          for attempt in 1 2 3 4 5; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "${HEALTH_URL}" || true)"
            if [[ "${code}" == "200" ]]; then
              echo "Health check passed on attempt ${attempt}."
              exit 0
            fi
            echo "Health check attempt ${attempt} failed with HTTP ${code}; retrying..."
            sleep 15
          done

          echo "::error::Health endpoint did not return HTTP 200 after deployment."
          exit 1

      - name: Create Deployment Attestation
        if: success()
        run: |
          cat > deployment-attestation.json <<'EOF'
          {
            "deployment_type": "azure-container-apps",
            "container_app_name": "${DEPLOY_CONTAINER_APP}",
            "resource_group": "${DEPLOY_RESOURCE_GROUP}",
            "container_image": "${DEPLOY_IMAGE_REF}",
            "release_environment": "${{ inputs.release_environment }}",
            "deployed_by": "${{ github.actor }}",
            "deployed_at": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "deployment_id": "${{ github.run_id }}",
            "git_commit": "${{ github.sha }}",
            "git_branch": "${{ github.ref_name }}",
            "image_verified": ${{ inputs.verify_image }},
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

      - name: Upload Deployment Attestation
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-attestation
          path: deployment-attestation.json
