name: CI

# Legacy workflow kept for manual fallback. Main merge deployments are orchestrated by main-dev-release.yml.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build, test, and publish image
    uses: ./.github/workflows/workflow-build-v1.0.0.yml
    with:
      python_version: '3.11'
      working_directory: '.'
      release_environment: dev
      container_registry_url: ${{ vars.ACR_LOGIN_SERVER_DEV }}
      container_image_repository: 'project/fastapi-azure-app'
      azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      generate_sbom: true
      sign_image: false
