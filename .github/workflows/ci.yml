name: CI

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**/*.md'
      - '.github/**'
      - '.pipelines/variables/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (pylint)
        run: pylint src/

      - name: Unit tests with coverage
        run: pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=85

  build-and-publish:
    name: Build, scan, and publish image
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_DEV }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ vars.ACR_NAME_DEV }}

      - name: Build Docker image
        run: |
          docker build \
            -f Dockerfile \
            -t ${{ vars.ACR_LOGIN_SERVER_DEV }}/banking-system/fastapi-azure-app:${{ github.run_id }} \
            .

      - name: Trivy security scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ vars.ACR_LOGIN_SERVER_DEV }}/banking-system/fastapi-azure-app:${{ github.run_id }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Push image to ACR
        run: |
          docker push \
            ${{ vars.ACR_LOGIN_SERVER_DEV }}/banking-system/fastapi-azure-app:${{ github.run_id }}
